services:
  mariadb:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "123"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis-cache:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis-socketio:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  frappe:
    image: frappe/bench:latest
    command: >-
      bash -lc "sudo chown -R frappe:frappe /home/frappe/vibe-data && exec sleep infinity"
    environment:
      SHELL: /bin/bash
      VIBE_FRAME_REPO: /workspace/vibe-frame
      BENCH_DIR: /home/frappe/vibe-data/frappe-bench
      FRAPPE_BRANCH: version-15
      FRAPPE_SITE: builder.localhost
    volumes:
      - ..:/workspace/vibe-frame:cached
      - bench-data:/home/frappe/vibe-data
    working_dir: /workspace/vibe-frame
    ports:
      - "8000:8000"
      - "9000:9000"
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy

volumes:
  mariadb-data:
  bench-data:
