name: Vibe Frame Docker Smoke

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/**"
      - ".devcontainer/**"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "scripts/**"
      - ".devcontainer/**"
      - ".github/workflows/docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vibe-frame-docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Vibe Frame
        uses: actions/checkout@v4

      - name: Prepare ephemeral credentials
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "FRAPPE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Start Vibe Frame
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for Builder
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ! docker compose -f docker/docker-compose.yml ps --status running frappe | grep -q frappe; then
              echo "Frappe container is not running"
              docker compose -f docker/docker-compose.yml logs --no-color --tail=250 frappe || true
              exit 1
            fi

            status=$(curl -sS -o /tmp/vibe-frame-response.html -w "%{http_code}" \
              -H "Host: builder.localhost" \
              http://127.0.0.1:8000/builder || true)

            case "$status" in
              200|301|302|303|307|308)
                echo "Vibe Frame responded with HTTP $status"
                exit 0
                ;;
            esac

            if (( attempt % 12 == 0 )); then
              echo "Still waiting (attempt $attempt/180, HTTP ${status:-none})"
              docker compose -f docker/docker-compose.yml ps
              docker compose -f docker/docker-compose.yml logs --no-color --tail=30 frappe || true
            fi
            sleep 10
          done

          echo "Timed out waiting for Vibe Frame"
          exit 1

      - name: Verify installed app source
        run: |
          docker compose -f docker/docker-compose.yml exec -T frappe bash -lc '
            set -euo pipefail
            cd /home/frappe/vibe-data/frappe-bench
            bench --site builder.localhost list-apps | tee /tmp/apps.txt
            grep -Eq "^builder([[:space:]]|$)" /tmp/apps.txt
            test -d apps/builder/.git
            test -f apps/builder/builder/__init__.py
            ./env/bin/python -c "import builder; print(builder.__file__)"
            git -C apps/builder remote -v
          '

      - name: Collect Docker logs
        if: always()
        run: docker compose -f docker/docker-compose.yml logs --no-color > vibe-frame-docker.log 2>&1 || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-frame-docker-smoke-logs
          path: vibe-frame-docker.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans || true
